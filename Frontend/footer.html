<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Component</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #FFFFFF;
            --light-gray: #D9D9D9;
            --accent-color: #C8C96C;
            --accent-hover: #b8b95c;
            --placeholder-color: #6c757d;
            --copyright-color: #a0a0a0;
            --divider-color: rgba(255, 255, 255, 0.25);
        }

        body {
            font-family: 'Open Sans', sans-serif;
        }

        .custom-footer {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 50px 0;
            font-size: 14px;
        }

        .footer-logo-placeholder {
            background-color: var(--light-gray);
            height: 80px;
            width: 100%;
            max-width: 200px;
            margin-bottom: 25px;
        }

        .footer-contact-info p {
            margin-bottom: 8px;
            font-weight: 600;
        }

        .social-icons-container {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        .social-icon {
            width: 30px;
            height: 30px;
            background-color: var(--light-gray);
            border-radius: 50%;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .social-icon:hover {
            transform: scale(1.1);
            background-color: var(--accent-color);
        }

        .footer-heading {
            font-family: 'Anton', sans-serif;
            font-style: italic;
            font-size: 28px;
            margin-bottom: 25px;
            color: var(--text-color);
            letter-spacing: 1px;
        }

        .footer-links {
            list-style: none;
            padding-left: 0;
        }

        .footer-links li {
            margin-bottom: 12px;
        }

        .footer-links a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 600;
        }

        .footer-links a:hover {
            color: var(--accent-color);
        }

        .footer-col {
            padding: 0 30px;
        }

        .vertical-divider {
            border-left: 1px solid var(--divider-color);
        }

        .newsletter-form p {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .newsletter-form .form-control {
            background-color: var(--light-gray);
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            height: 48px;
            color: #000;
        }

        .newsletter-form .form-control::placeholder {
            color: var(--placeholder-color);
            font-weight: bold;
            font-size: 14px;
        }

        .newsletter-form .btn-submit {
            background-color: var(--accent-color);
            color: var(--text-color);
            font-weight: bold;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            width: 100%;
            max-width: 120px;
            height: 48px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .newsletter-form .btn-submit:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .copyright {
            color: var(--copyright-color);
            font-size: 12px;
            margin-top: 15px;
        }

        @media (max-width: 991.98px) {
            .footer-col {
                margin-bottom: 40px;
                padding: 0 15px;
            }

            .vertical-divider {
                border-left: none;
            }

            .col-company, .col-newsletter {
                border-top: 1px solid var(--divider-color);
                padding-top: 40px;
            }

            .custom-footer .row > .col-md-6:nth-child(2) .vertical-divider {
                border-left: 1px solid var(--divider-color);
            }
        }

        @media (max-width: 767.98px) {
            .custom-footer {
                text-align: center;
            }

            .footer-logo-placeholder {
                margin: 0 auto 25px;
            }

            .social-icons-container {
                justify-content: center;
            }

            .footer-col {
                padding-top: 30px;
                margin-bottom: 0;
            }

            .footer-col:not(:first-child) {
                border-top: 1px solid var(--divider-color);
            }

            .col-company, .col-newsletter {
                border-top: none;
                padding-top: 30px;
            }

            .brand-columns {
                text-align: center;
            }

            .brand-columns .col-6 {
                flex: 0 0 100%;
                max-width: 100%;
            }

            .newsletter-form .btn-submit {
                margin: 15px auto 0;
            }

            .newsletter-form .d-flex {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <footer class="custom-footer">
        <div class="container">
            <div class="row">
                <div class="col-lg-3 col-md-6 footer-col">
                    <div class="footer-logo-placeholder"></div>
                    <div class="footer-contact-info">
                        <p>Call us: 077xxxxxxxx</p>
                        <p>"your slogan"</p>
                        <p>Example@abc.com</p>
                    </div>
                    <div class="social-icons-container">
                        <a href="#" aria-label="Social Media 1"><div class="social-icon"></div></a>
                        <a href="#" aria-label="Social Media 2"><div class="social-icon"></div></a>
                        <a href="#" aria-label="Social Media 3"><div class="social-icon"></div></a>
                    </div>
                </div>

                <div class="col-lg-2 col-md-6 footer-col vertical-divider col-company">
                    <h3 class="footer-heading">COMPANY</h3>
                    <ul class="footer-links">
                        <li><a href="#">ABOUT US</a></li>
                        <li><a href="#">CONTACT US</a></li>
                        <li><a href="#">DATA POLICY</a></li>
                    </ul>
                </div>

                <div class="col-lg-4 col-md-6 footer-col vertical-divider">
                    <h3 class="footer-heading">TOP BRAND</h3>
                    <div class="row brand-columns">
                        <div class="col-6">
                            <ul class="footer-links">
                                <li><a href="#">La Roche-Posay</a></li>
                                <li><a href="#">L'Oréal</a></li>
                                <li><a href="#">Thorakao</a></li>
                                <li><a href="#">Cocoon</a></li>
                            </ul>
                        </div>
                        <div class="col-6">
                            <ul class="footer-links">
                                <li><a href="#">Estée Lauder</a></li>
                                <li><a href="#">Decumar</a></li>
                                <li><a href="#">Shiseido</a></li>
                                <li><a href="#">Innisfree</a></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="col-lg-3 col-md-6 footer-col vertical-divider col-newsletter">
                    <form class="newsletter-form" id="newsletterForm">
                        <p>Sign up Newletter</p>
                        <div class="d-flex gap-2">
                            <input type="email" class="form-control" placeholder="YOUR EMAIL" required>
                            <button type="submit" class="btn btn-submit">Submit</button>
                        </div>
                        <div class="copyright">@ 2025 all right reserved</div>
                    </form>
                </div>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('newsletterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Thank you for subscribing!');
            this.reset();
        });
    </script>
</body>
</html>
